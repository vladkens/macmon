name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - run: rustup update --no-self-update stable && rustup default stable
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  # vladkens/actions: build makes the archive; publish ships the dev pre-release, or the crate and release on a release: commit
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # IOKit: the build and the crates dry run need a Mac
    steps:
      - uses: actions/checkout@v7
      - run: rustup update --no-self-update stable && rustup default stable
      # builds outside release commits as the `git describe` version, e.g. 0.9.0-12-g3672a1b
      - uses: vladkens/actions/rust-build@v1
        with:
          dist: make dist

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest # never compiles
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: vladkens/actions/rust-publish@v1

      - name: Bump Homebrew formula
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ steps.release.outputs.files }}
          HOMEBREW_REPO_TOKEN: ${{ secrets.HOMEBREW_REPO_TOKEN }}
        run: |
          if [ "$(basename "$FILE")" != "macmon-${TAG}.tar.gz" ]; then
            echo "Error: expected the single file macmon-${TAG}.tar.gz, got '$FILE'"
            exit 1
          fi
          SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/macmon-${TAG}.tar.gz"

          git clone "https://x-access-token:${HOMEBREW_REPO_TOKEN}@github.com/vladkens/homebrew-tap.git" tap
          cd tap
          sed -i "s|version \".*\"|version \"${TAG#v}\"|" macmon.rb
          sed -i "s|url \".*\"|url \"${URL}\"|" macmon.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" macmon.rb
          if git diff --quiet; then
            echo "Formula already at ${TAG}"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add macmon.rb
          git commit -m "macmon ${TAG}"
          git push
