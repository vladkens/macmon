name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - run: rustup update --no-self-update stable && rustup default stable
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  dev:
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: dev-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - run: rustup update --no-self-update stable && rustup default stable
      - run: make build

      - name: Archive binary
        run: tar czf macmon-dev.tar.gz readme.md LICENSE -C target/release macmon

      - name: Update dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA, skipping"
            exit 0
          fi
          NOTES="Latest build of \`main\` at ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
          git tag -f dev
          git push -f origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev macmon-dev.tar.gz --clobber
            gh release edit dev --title "Dev build" --notes "$NOTES"
          else
            gh release create dev macmon-dev.tar.gz --prerelease --title "Dev build" --notes "$NOTES"
          fi

  release:
    if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - name: Check release commit matches Cargo.toml version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          TAG="v$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$TITLE" != "release: $TAG" ]; then
            echo "Error: expected commit title 'release: $TAG', got '$TITLE'"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null &&
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
            echo "Error: tag $TAG already points to another commit"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Extract changelog entry
        run: |
          awk -v tag="$TAG" '/^## / { found = ($2 == tag); next } found && $0 != "---"' changelog.md > release_notes.txt
          if ! grep -q '^- [^[:space:]]' release_notes.txt; then
            echo "Error: no changes listed in changelog for $TAG"
            exit 1
          fi

      - run: rustup update --no-self-update stable && rustup default stable
      - run: make build

      - name: Check binary version matches tag
        run: test "$(./target/release/macmon -V)" = "macmon ${TAG#v}"

      - name: Archive binary
        run: |
          tar czf "macmon-${TAG}.tar.gz" readme.md LICENSE -C target/release macmon
          ls -lah "macmon-${TAG}.tar.gz"

      # https://crates.io/docs/trusted-publishing
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if curl -fsS -o /dev/null -A "macmon-ci (github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/macmon/${TAG#v}"; then
            echo "macmon ${TAG#v} already published"
          else
            cargo publish --locked
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, using its archive"
            gh release download "$TAG" --pattern "macmon-${TAG}.tar.gz" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --notes-file release_notes.txt "macmon-${TAG}.tar.gz"
          fi

      - name: Bump Homebrew formula
        env:
          HOMEBREW_REPO_TOKEN: ${{ secrets.HOMEBREW_REPO_TOKEN }}
        run: |
          TARBALL="macmon-${TAG}.tar.gz"
          SHA256=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARBALL}"

          git clone "https://x-access-token:${HOMEBREW_REPO_TOKEN}@github.com/vladkens/homebrew-tap.git" tap
          cd tap
          sed -i '' "s|version \".*\"|version \"${TAG#v}\"|" macmon.rb
          sed -i '' "s|url \".*\"|url \"${URL}\"|" macmon.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" macmon.rb
          if git diff --quiet; then
            echo "Formula already at ${TAG}"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add macmon.rb
          git commit -m "macmon ${TAG}"
          git push
