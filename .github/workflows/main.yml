name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - run: rustup update --no-self-update stable && rustup default stable
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  # The shared release steps (vladkens/actions): `build` runs `make dist` read-only, beside `test`;
  # on main `publish` puts the archive up as the `dev` pre-release, and a `release: vX.Y.Z (#N)`
  # commit publishes the crate and the same archive as macmon-vX.Y.Z.tar.gz. `publish` never
  # compiles. Users check an archive with `gh attestation verify FILE -R vladkens/macmon`.
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # macmon links IOKit: the build and the crates dry run need a Mac
    steps:
      - uses: actions/checkout@v7
      - run: rustup update --no-self-update stable && rustup default stable
      # Outside release commits it builds with the `git describe` version, e.g. 0.9.0-12-g3672a1b.
      # TODO: back to @v1 once it includes dev-version
      - uses: vladkens/actions/rust-build@37f752bc0ff5f90a4ee8f30e297ee2dc969e4d97
        with:
          dist: make dist

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: vladkens/actions/rust-publish@v1

      - name: Bump Homebrew formula
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ steps.release.outputs.files }}
          HOMEBREW_REPO_TOKEN: ${{ secrets.HOMEBREW_REPO_TOKEN }}
        run: |
          if [ "$(basename "$FILE")" != "macmon-${TAG}.tar.gz" ]; then
            echo "Error: expected the single file macmon-${TAG}.tar.gz, got '$FILE'"
            exit 1
          fi
          SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/macmon-${TAG}.tar.gz"

          git clone "https://x-access-token:${HOMEBREW_REPO_TOKEN}@github.com/vladkens/homebrew-tap.git" tap
          cd tap
          sed -i "s|version \".*\"|version \"${TAG#v}\"|" macmon.rb
          sed -i "s|url \".*\"|url \"${URL}\"|" macmon.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" macmon.rb
          if git diff --quiet; then
            echo "Formula already at ${TAG}"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add macmon.rb
          git commit -m "macmon ${TAG}"
          git push
